<!DOCTYPE html><html><head><meta charset="utf-8"><title>v24</title>
<style>#r{font:13px/1.1 monospace;white-space:pre-wrap;margin:3px;word-break:break-all}</style>
</head><body><div id="r">v24</div>
<script>
var R=document.getElementById('r');
function L(s){R.textContent+='\n'+String(s);}
function busy(ms){var t=Date.now();while(Date.now()-t<ms){}}
async function F(tag,url,opt){
  opt=opt||{}; opt.mode='cors';
  var c=new AbortController(); var to=setTimeout(function(){c.abort();},7000); opt.signal=c.signal;
  try{
    var r=await fetch(url,opt); clearTimeout(to);
    var t=await r.text();
    L(tag+' ST'+r.status+' '+t.replace(/\s+/g,' ').slice(0,220));
  }catch(e){clearTimeout(to); L(tag+' ERR '+e.message);}
}
async function main(){
  var tok=(location.hash||'').replace(/^#/,'');
  L('tok='+(tok?tok.length:0));
  var KEY='dc-prod-virgoweb';
  var H={'x-api-key':KEY,'Authorization':'Bearer '+tok};
  var jobs=[
    F('ims','https://ims-na1.adobelogin.com/ims/userinfo/v1?client_id='+KEY,{headers:{'Authorization':'Bearer '+tok}}),
    F('prof','https://ims-na1.adobelogin.com/ims/profile/v1?client_id='+KEY,{headers:{'Authorization':'Bearer '+tok}}),
    F('edge','https://platform-cs-edge-jpn3.adobe.io/',{headers:H}),
    F('lim','https://dc-genai-access-provisioning-api.adobe.io/users/ai/limits',{headers:Object.assign({},H,{'Accept':'application/vnd.adobe.dc+json; profile="https://dc-genai-access-provisioning-api.adobe.io/schemas/limits_v2.json"'})}),
    F('feat','https://dc-genai-access-provisioning-api.adobe.io/users/ai/features',{headers:Object.assign({},H,{'Accept':'application/json'})}),
    F('stor','https://cc-api-storage.adobe.io/',{headers:H}),
    F('disc','https://dcdiscovery.adobe.io/1785845424/index',{headers:Object.assign({},H,{'Accept':'application/json'})}),
    F('col','https://platform-cs-edge-jpn3.adobe.io/dckwcs/1785845424/kwcollections/urn%3Aaaid%3Asc%3AAP%3Af908ffd5-2a5b-4524-85bc-9701f66858d2?publicId=kwc_curated',{headers:Object.assign({},H,{'Accept':'application/vnd.adobe.dc+json;profile="https://dc-kwcollection.adobe.io/schemas/kwcollection_v1.json"'})}),
  ];
  await Promise.allSettled(jobs);
  L('===ALL===');
  // busy-wait so print pipeline waits for full DOM (matches prior successful 12s pattern)
  busy(9000);
  L('===END===');
}
main();
</script></body></html>
