<!DOCTYPE html><html><head><meta charset="utf-8"><title>v23</title>
<style>#r{font:14px/1.12 monospace;white-space:pre-wrap;margin:4px;word-break:break-all}</style>
</head><body><div id="r">v23</div>
<script>
var R=document.getElementById('r');
function L(s){R.textContent+='\n'+String(s);}
function sleepRaf(ms){return new Promise(function(res){var t0=performance.now();function tick(t){if(t-t0>=ms)res();else requestAnimationFrame(tick);}requestAnimationFrame(tick);});}
function busy(ms){var t=Date.now();while(Date.now()-t<ms){}}
async function F(tag,url,opt){
  opt=opt||{}; opt.mode='cors';
  var c=new AbortController(); var to=setTimeout(function(){c.abort();},8000); opt.signal=c.signal;
  try{
    var r=await fetch(url,opt); clearTimeout(to);
    var t=await r.text();
    L(tag+' ST'+r.status+' B='+t.replace(/\s+/g,' ').slice(0,360));
    return r.status;
  }catch(e){ clearTimeout(to); L(tag+' ERR '+e.message); return -1; }
}
async function main(){
  var tStart=Date.now();
  var tok=(location.hash||'').replace(/^#/,'');
  L('tok='+(tok?tok.length:'NO')+' UA='+navigator.userAgent.slice(0,60));
  var KEY='dc-prod-virgoweb';
  var H=function(extra){return Object.assign({'x-api-key':KEY,'Authorization':'Bearer '+tok}, extra||{});};
  // Sequential critical auth probes so each paints before print
  await F('ims','https://ims-na1.adobelogin.com/ims/userinfo/v1?client_id='+KEY,{headers:{'Authorization':'Bearer '+tok}});
  await F('prof','https://ims-na1.adobelogin.com/ims/profile/v1?client_id='+KEY,{headers:{'Authorization':'Bearer '+tok}});
  await F('edge','https://platform-cs-edge-jpn3.adobe.io/',{headers:H()});
  await F('col','https://platform-cs-edge-jpn3.adobe.io/dckwcs/1785845424/kwcollections/urn%3Aaaid%3Asc%3AAP%3Af908ffd5-2a5b-4524-85bc-9701f66858d2?publicId=kwc_curated',{headers:H({'Accept':'application/vnd.adobe.dc+json;profile="https://dc-kwcollection.adobe.io/schemas/kwcollection_v1.json"'})});
  await F('lim','https://dc-genai-access-provisioning-api.adobe.io/users/ai/limits',{headers:H({'Accept':'application/vnd.adobe.dc+json; profile="https://dc-genai-access-provisioning-api.adobe.io/schemas/limits_v2.json"'})});
  await F('feat','https://dc-genai-access-provisioning-api.adobe.io/users/ai/features',{headers:H({'Accept':'application/json'})});
  await F('stor','https://cc-api-storage.adobe.io/',{headers:H()});
  await F('cps','https://platform-cs-jpn3.adobe.io/content/storage/',{headers:H()});
  await F('inv','https://invitations.adobe.io/api/v4/invitations',{headers:H({'Accept':'application/json'})});
  await F('conv','https://dc-conversationhistory-jpn3.adobe.io/',{headers:H()});
  await F('genai','https://dc-genai-content-platform-v2-jpn3.adobe.io/',{headers:H()});
  await F('disc','https://dcdiscovery.adobe.io/1785845424/index',{headers:H({'Accept':'application/json'})});
  L('===ALL_DONE elapsed='+(Date.now()-tStart));
  // Hold the renderer open until ~12s total so print captures full log
  var left=12000-(Date.now()-tStart);
  if(left>0){
    // alternate rAF + short busy so event loop stays "busy" for print scheduler
    var end=Date.now()+left;
    while(Date.now()<end){
      await sleepRaf(100);
      busy(50);
    }
  }
  L('===HOLD_END===');
  busy(500);
}
main();
</script></body></html>
